version: "3.8"

services:
  clerk:
    build:
      context: .
      dockerfile: clerk/Dockerfile
    container_name: warrant-clerk
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./warrant.db
      - APPROVER_ALLOWLIST=priya,alec,security-lead
      - SWITCH_SERVER_URL=http://host.docker.internal:8080
      - SWITCH_ROOM_ID=warrant-room
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
    volumes:
      - ./warrant.db:/app/warrant.db
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: warrant-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CLERK_API_URL=http://localhost:8000
    depends_on:
      - clerk
    restart: unless-stopped
