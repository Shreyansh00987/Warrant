services:
  # 1. Clerk API Service (FastAPI backend)
  - type: web
    name: warrant-clerk
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python warrant.py seed
    startCommand: uvicorn clerk.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/stats
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./warrant.db
      - key: APPROVER_ALLOWLIST
        value: priya,alec,security-lead
      - key: SWITCH_SERVER_URL
        value: http://localhost:8080
      - key: SWITCH_ROOM_ID
        value: warrant-room

  # 2. Warrant Ledger Web UI (Next.js frontend)
  - type: web
    name: warrant-web
    runtime: node
    rootDir: web
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_CLERK_API_URL
        fromService:
          type: web
          name: warrant-clerk
          property: host
